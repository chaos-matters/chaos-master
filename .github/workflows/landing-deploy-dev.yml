name: Deploy landing (dev)

# Deploy the landing page to the DEV Worker (about.dev.chaos-master.com) on every
# push to main that touches the landing package. The `paths` filter means an app-
# only change won't redeploy the dev landing (per request). Note: changes to
# packages/app that the landing bundles won't trigger this either — bump/touch the
# landing or tag `vA.B.C-web` for those.
on:
  push:
    branches: [main]
    paths:
      - 'packages/landing/**'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy landing → dev
    runs-on: ubuntu-latest
    # Only the canonical upstream repo deploys; skipped entirely on forks. See
    # deploy.yml for the rationale and the DISABLE_DEPLOYS override.
    if: github.repository == 'chaos-matters/chaos-master'
    env:
      DEPLOY_ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && vars.DISABLE_DEPLOYS != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build landing (static assets → dist/)
        run: pnpm --filter @chaos-master/landing run build
      - name: Deploy (dev)
        if: env.DEPLOY_ENABLED == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env dev
          packageManager: pnpm
          workingDirectory: packages/landing
