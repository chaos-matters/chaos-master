name: Chaos-Master CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Runs the same jobs on any branch, on demand.
  workflow_dispatch:

# Every job runs on pull requests, on pushes to main and on a manual run alike
# (since 2026-09-24; before that a pull request ran a scoped app suite and no
# `health`). The jobs run in parallel, so a pull request waits for its slowest
# job, not for the sum of them: lint, typecheck, the test shards and the
# build-and-e2e job each take a runner of their own.
#
# Type-aware linting (typescript-eslint strictTypeChecked + projectService)
# holds the whole TS program in memory; on this codebase peak is ~2.5GB, which
# OOMs Node's ~2GB default heap. The runner has 16GB, so the jobs that build
# the program (lint, typecheck, the vitest shards) lift the ceiling well clear
# of the peak rather than throttling CI. See eslint.config.js (docs content
# files are already dropped to syntax-only linting to trim peak).

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x

    - name: Install all dependencies
      run: |
        corepack enable
        pnpm install

    - name: Lint code
      run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x

    - name: Install all dependencies
      run: |
        corepack enable
        pnpm install

    - name: Type check
      run: pnpm typecheck

  # The full suite, `pnpm test`, on every pull request, split so it finishes
  # in a few minutes of wall-clock: the app's vitest suite in three shards
  # (vitest --shard splits its test files), and core, mobile-runtime and the
  # node --test script suites in a fourth leg. `pnpm test` is exactly
  # `pnpm test:packages && pnpm test:app`, so the legs together run what it
  # runs; a new suite goes into one of those two scripts and CI picks it up.
  # fail-fast is off so one red shard does not hide another.
  #
  # The scoped run (`pnpm test:pr`, scripts/test-changed.mjs) is a local tool
  # now, for checking a change quickly before pushing; CI no longer uses it.
  test:
    name: test (${{ matrix.part }})
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: app 1/3
            run: pnpm test:app --shard=1/3
          - part: app 2/3
            run: pnpm test:app --shard=2/3
          - part: app 3/3
            run: pnpm test:app --shard=3/3
          - part: core, mobile-runtime, scripts
            run: pnpm test:packages
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x

    - name: Install all dependencies
      run: |
        corepack enable
        pnpm install

    - name: Run tests (${{ matrix.part }})
      run: ${{ matrix.run }}

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x

    - name: Install all dependencies
      run: |
        corepack enable
        pnpm install

    - name: Build the app
      run: pnpm --filter chaos-master run build

    # The landing site has no tests, which is defensible for a marketing page.
    # Not building it is not: nothing else in CI compiles it.
    - name: Build landing
      run: pnpm --filter @chaos-master/landing run build

    - name: Install Playwright browsers
      run: pnpm exec playwright install --with-deps chromium

    # The chromium-ci Playwright project: every *.ci.spec.ts, i.e. the specs
    # that hold on the software WebGPU (swiftshader) GitHub runners provide.
    # The rest of tests/ is not enforced here (see packages/app/TESTING.md).
    # A skip in this project fails the run.
    - name: Run CI-safe e2e
      run: pnpm test:e2e:ci

    - name: Upload Playwright report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14

  # Every `file:line` citation in a living doc must still point at the symbol
  # it names (scripts/check-doc-citations.mjs; the rules are in
  # docs/agent/CONVENTIONS.md section 9). A citation goes stale in the change
  # that moves the code, and that change's author is the one who knows where
  # it went. It is a job of its own so a
  # stale line number never hides a failing test, nor the other way round. It
  # needs full history, for citations pinned to an old revision, and no
  # install: the script uses node and git only, and takes under a second.
  citations:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x

    - name: Check the file:line citations in the docs
      run: node scripts/check-doc-citations.mjs

  # The code-health checks: the generated index, the metrics ratchet and the
  # module graph. On pull requests too since 2026-09-24 (about 25 s), so a
  # change that moves a ratchet sees it fail before the merge, not main after
  # it. They sit in their own job so that a ratchet failure can never hide a
  # test failure, and so the branch that fixes a ratchet is obvious from the
  # job that went red.
  health:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x

    - name: Install all dependencies
      run: |
        corepack enable
        pnpm install

    # Both scripts walk packages/ and read files. Neither builds a TypeScript
    # program, so the raised heap the build job needs is not needed here.
    - name: Check the generated agent index is current
      run: pnpm docs:index:check

    - name: Check the code metrics ratchet
      run: pnpm metrics:check

    # dependency-cruiser over packages/app/src and packages/core/src
    # (.dependency-cruiser.cjs): import cycles, orphan modules and core's
    # purity are errors. It needs Node 22, 24 or 26+, which this job pins, and
    # it resolves `@/` through tsconfig.depcruise.json; without that file the
    # graph loses most of its edges and the cycle rule passes vacuously.
    - name: Check the module graph for cycles and orphans
      run: pnpm arch


