name: Build & Deploy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
    tags:
      - 'v*'
      # Exclude landing release tags (vA.B.C-web) — those deploy the landing
      # package via landing-deploy-prod.yml, not the app.
      - '!*-web'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-deploy:
    name: Build & Deploy App
    runs-on: ubuntu-latest

    # Only the canonical upstream repo builds + deploys. On any fork this whole job is
    # skipped: forks don't redundantly rebuild (the standalone Chaos-Master CI in
    # node.js.yml already runs lint/typecheck/test/build there) and never attempt a
    # Cloudflare deploy they have no credentials for. Update this if the canonical
    # deployer ever moves.
    if: github.repository == 'chaos-matters/chaos-master'

    # Second layer, for the upstream repo itself: a PR opened *from* a fork runs here
    # (the base repo is upstream) but GitHub withholds secrets for fork PRs, so gate
    # each wrangler step on the token actually being present rather than failing. Set
    # repo variable DISABLE_DEPLOYS=true to force-disable deploys even where it exists.
    env:
      DEPLOY_ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && vars.DISABLE_DEPLOYS != 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug Info
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Target Branch: ${{ github.base_ref }}"

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.environment }}" == "dev" ]]; then
              pnpm --filter chaos-master run build:dev
            else
              pnpm --filter chaos-master run build
            fi
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            pnpm --filter chaos-master run build:dev
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pnpm --filter chaos-master run build:dev
          else
            pnpm --filter chaos-master run build
          fi

      - name: Verify build output
        run: |
          test -f packages/app/dist/index.html || exit 1
          echo "Build artifacts verified"

      # Dev is the continuously deployed editorial environment. Apply its
      # append-only D1 migrations before the Worker that reads them goes live,
      # both on main and on an explicitly requested manual dev deploy. Prod
      # remains a separate, deliberate release operation.
      - name: Apply Dev Content Migrations
        if: >-
          env.DEPLOY_ENABLED == 'true' &&
          ((github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev'))
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply chaos-master-content-dev --remote
          packageManager: 'pnpm'
          workingDirectory: 'packages/app'

      # Manual Deploy via workflow_dispatch
      - name: Manual Deploy
        if: github.event_name == 'workflow_dispatch' && env.DEPLOY_ENABLED == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env ${{ github.event.inputs.environment }}
          packageManager: 'pnpm'
          workingDirectory: 'packages/app'

      # Deploys to dev.lumenapeiron.com when pushing to the main branch
      - name: Deploy to Dev Environment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.DEPLOY_ENABLED == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env dev
          packageManager: 'pnpm'
          workingDirectory: 'packages/app'

      # Deploys to preview on PRs
      - name: Deploy PR Preview
        id: deploy-preview
        if: github.event_name == 'pull_request' && env.DEPLOY_ENABLED == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env preview
          packageManager: 'pnpm'
          workingDirectory: 'packages/app'

      # Post or update PR comment with preview link from template
      - name: Post Preview Link
        if: github.event_name == 'pull_request' && env.DEPLOY_ENABLED == 'true' && steps.deploy-preview.outputs.deployment-url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const templatePath = path.join(process.env.GITHUB_WORKSPACE, '.github/workflows/pr-deployment-table.md');
            let body = fs.readFileSync(templatePath, 'utf8');

            const url = '${{ steps.deploy-preview.outputs.deployment-url }}';
            const commit = context.sha.substring(0, 7);
            const commitUrl = `${context.server_url}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
            const logsUrl = `${context.server_url}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const updated = new Date().toUTCString();

            body = body
              .replace(/PREVIEW_URL/g, url)
              .replace('COMMIT_SHA', commit)
              .replace('COMMIT_URL', commitUrl)
              .replace('LOGS_URL', logsUrl)
              .replace('UPDATED_TIME', updated);

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Deploying with Cloudflare Workers')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      # Deploys to lumenapeiron.com when pushing a tag starting with 'v'
      - name: Deploy to Production Environment
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' && env.DEPLOY_ENABLED == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env prod
          packageManager: 'pnpm'
          workingDirectory: 'packages/app'
