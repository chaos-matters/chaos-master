<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7928ca" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg" />
    <title>Lumen Apeiron — WebGPU Fractal Flame Editor</title>
    <meta
      name="description"
      content="Create, explore, and animate IFS fractal flames in real time with Lumen Apeiron (formerly Chaos Master) — a free, GPU-accelerated fractal flame editor that runs entirely in your browser with WebGPU."
    />
    <link rel="canonical" href="https://lumenapeiron.com/" />

    <!-- Default social-share card. The Cloudflare Worker (src/worker/index.ts)
         swaps everything between these markers for per-flame Open Graph tags when
         a link carries ?s= / ?flame=, so a shared link never gets duplicate og:*
         tags. Keep the markers intact. -->
    <!-- og:default:start -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lumen Apeiron" />
    <meta
      property="og:title"
      content="Lumen Apeiron — WebGPU Fractal Flame Editor"
    />
    <meta
      property="og:description"
      content="Create, explore, and animate IFS fractal flames in real time, right in your browser with WebGPU."
    />
    <meta property="og:url" content="https://lumenapeiron.com/" />
    <meta property="og:image" content="https://lumenapeiron.com/og-cover.jpg" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta
      property="og:image:alt"
      content="A multicolored IFS fractal flame rendered in real time by Lumen Apeiron"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Lumen Apeiron — WebGPU Fractal Flame Editor"
    />
    <meta
      name="twitter:description"
      content="Create, explore, and animate IFS fractal flames in real time, right in your browser with WebGPU."
    />
    <meta
      name="twitter:image"
      content="https://lumenapeiron.com/og-cover.jpg"
    />
    <!-- og:default:end -->
  </head>
  <body>
    <noscript>
      <h1>Lumen Apeiron — WebGPU Fractal Flame Editor</h1>
      <p>
        Lumen Apeiron (formerly Chaos Master) is a free, GPU-accelerated tool
        for creating, exploring, and animating IFS fractal flames in real time —
        running entirely in your browser with WebGPU. Enable JavaScript and open
        it in a WebGPU-capable browser (Chrome / Edge 113+, Safari 17+) to
        launch the editor.
      </p>
      <p>
        <a href="https://about.lumenapeiron.com/"
          >Learn more about Lumen Apeiron</a
        >
      </p>
    </noscript>
    <div id="root"></div>
    <script src="/crashHandler.js"></script>
    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
